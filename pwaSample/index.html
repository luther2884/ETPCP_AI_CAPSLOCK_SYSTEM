<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#00f5ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TechWorld" />
  <meta name="description" content="Progressive Web App - Native App Experience" />
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  
  <title>TechWorld PWA</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e0e6ed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: linear-gradient(45deg, #00f5ff, #0080ff);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: white;
      box-shadow: 0 10px 30px rgba(0, 245, 255, 0.3);
    }

    h1 {
      color: #00f5ff;
      font-size: 32px;
      margin-bottom: 15px;
      font-weight: 700;
    }

    p {
      color: #94a3b8;
      font-size: 18px;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .status {
      background: rgba(0, 245, 255, 0.1);
      border: 2px solid rgba(0, 245, 255, 0.3);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .status-label {
      color: #cbd5e1;
      font-size: 14px;
    }

    .status-value {
      color: #00f5ff;
      font-weight: 600;
      font-size: 14px;
    }

    .status-value.ready {
      color: #10b981;
    }

    .status-value.waiting {
      color: #f59e0b;
    }

    button {
      background: linear-gradient(45deg, #00f5ff, #0080ff);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(0, 128, 255, 0.4);
      width: 100%;
      max-width: 300px;
      margin: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(0, 128, 255, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .features {
      margin-top: 40px;
      text-align: left;
    }

    .features h2 {
      color: #00f5ff;
      font-size: 20px;
      margin-bottom: 15px;
      text-align: center;
    }

    .feature-list {
      list-style: none;
      padding: 0;
    }

    .feature-list li {
      color: #cbd5e1;
      padding: 10px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .feature-list li:before {
      content: "✓";
      color: #10b981;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">TW</div>
    <h1>TechWorld PWA</h1>
    <p>Progressive Web App - Native App Experience</p>

    <div class="status" id="status">
      <div class="status-item">
        <span class="status-label">Service Worker:</span>
        <span class="status-value" id="sw-status">Checking...</span>
      </div>
      <div class="status-item">
        <span class="status-label">Install Prompt:</span>
        <span class="status-value" id="prompt-status">Waiting...</span>
      </div>
      <div class="status-item">
        <span class="status-label">App Installed:</span>
        <span class="status-value" id="installed-status">No</span>
      </div>
    </div>

    <button id="install-btn" onclick="installApp()">Install App</button>
    <button onclick="checkStatus()">Refresh Status</button>

    <div class="features">
      <h2>PWA Features</h2>
      <ul class="feature-list">
        <li>Works Offline</li>
        <li>Fast Loading</li>
        <li>Native App Feel</li>
        <li>Installable</li>
        <li>Push Notifications</li>
        <li>Background Sync</li>
      </ul>
    </div>
  </div>

  <script>
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');
    const swStatus = document.getElementById('sw-status');
    const promptStatus = document.getElementById('prompt-status');
    const installedStatus = document.getElementById('installed-status');

    // Check if app is installed
    function checkInstalled() {
      const isInstalled = window.matchMedia('(display-mode: standalone)').matches || 
                         window.navigator.standalone === true ||
                         document.referrer.includes('android-app://');
      
      if (isInstalled) {
        installedStatus.textContent = 'Yes';
        installedStatus.className = 'status-value ready';
        installBtn.style.display = 'none';
      } else {
        installedStatus.textContent = 'No';
        installedStatus.className = 'status-value';
      }
    }

    // Check service worker status
    async function checkServiceWorker() {
      if ('serviceWorker' in navigator) {
        try {
          const registration = await navigator.serviceWorker.getRegistration();
          if (registration) {
            swStatus.textContent = 'Registered';
            swStatus.className = 'status-value ready';
          } else {
            swStatus.textContent = 'Not Registered';
            swStatus.className = 'status-value waiting';
            // Try to register
            try {
              await navigator.serviceWorker.register('./sw.js');
              swStatus.textContent = 'Registered';
              swStatus.className = 'status-value ready';
            } catch (err) {
              swStatus.textContent = 'Failed';
              console.error('SW registration failed:', err);
            }
          }
        } catch (err) {
          swStatus.textContent = 'Error';
          console.error('SW check failed:', err);
        }
      } else {
        swStatus.textContent = 'Not Supported';
      }
    }

    // Listen for beforeinstallprompt
    window.addEventListener('beforeinstallprompt', (e) => {
      console.log('✅ beforeinstallprompt event fired!');
      e.preventDefault();
      deferredPrompt = e;
      promptStatus.textContent = 'Available';
      promptStatus.className = 'status-value ready';
      installBtn.disabled = false;
      installBtn.textContent = 'Install App Now';
    });

    // Install app function
    async function installApp() {
      if (deferredPrompt) {
        installBtn.disabled = true;
        installBtn.textContent = 'Installing...';
        
        try {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          
          if (outcome === 'accepted') {
            console.log('✅ User accepted the install prompt');
            installBtn.textContent = 'Installed!';
            checkInstalled();
          } else {
            console.log('User dismissed the install prompt');
            installBtn.disabled = false;
            installBtn.textContent = 'Install App';
          }
          
          deferredPrompt = null;
          promptStatus.textContent = 'Used';
        } catch (error) {
          console.error('Error showing install prompt:', error);
          installBtn.disabled = false;
          installBtn.textContent = 'Install App';
        }
      } else {
        alert('Install prompt not available. Please use your browser menu to install.');
      }
    }

    // Listen for app installed
    window.addEventListener('appinstalled', () => {
      console.log('✅ PWA was installed');
      checkInstalled();
      promptStatus.textContent = 'Installed';
      promptStatus.className = 'status-value ready';
    });

    // Check status function
    function checkStatus() {
      checkServiceWorker();
      checkInstalled();
      if (!deferredPrompt) {
        promptStatus.textContent = 'Waiting...';
        promptStatus.className = 'status-value waiting';
      }
    }

    // Initialize
    checkStatus();
    
    // Register service worker on load
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('✅ Service Worker registered:', reg.scope);
            checkServiceWorker();
          })
          .catch(err => {
            console.error('❌ Service Worker failed:', err);
            checkServiceWorker();
          });
      });
    }
  </script>
</body>
</html>
